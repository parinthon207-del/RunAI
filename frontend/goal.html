<body>
<header class="navbar"><div class="container nav-content"><a class="logo" href="index.html">run<span>ai</span></a><nav><a href="index.html">หน้าแรก</a><a href="profile.html">ข้อมูลผู้ใช้</a><a class="active" href="goal.html">เป้าหมาย</a><a href="#" onclick="logout();return false;">ออกจากระบบ</a><a href="run.html">บันทึกการวิ่ง</a><a href="history.html">ประวัติ</a></nav></div></header>

<section class="list-card"><div class="card-header"><h2>เป้าหมายของฉัน</h2><button class="btn btn-secondary small" onclick="loadGoals()">รีเฟรช</button></div><div id="goalList" class="simple-list"><p class="muted">กำลังโหลด...</p></div></section></div></main>
