<header class="navbar"><div class="container nav-content"><a class="logo" href="index.html">run<span>ai</span></a><nav><a href="index.html">หน้าแรก</a><a href="profile.html">ข้อมูลผู้ใช้</a><a href="goal.html">เป้าหมาย</a><a class="active" href="run.html">บันทึกการวิ่ง</a><a href="#" onclick="logout();return false;">ออกจากระบบ</a><a href="history.html">ประวัติ</a></nav></div></header>
